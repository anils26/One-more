<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>Swing Watchlist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts||document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<style>
:root{--bg:#14161c;--card:#1d2029;--tx:#e8eaf0;--mut:#8a91a3;--up:#2bb39a;--dn:#ee5d5d;--ac:#5b9bff;--bd:#2b2f3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:8px;padding:10px 12px}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:16px}
button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:15px}
button.p{background:var(--ac);border-color:var(--ac);color:#08111f;font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.chip{flex:none;text-align:left;padding:8px 12px;line-height:1.25}
.chip.on{border-color:var(--ac)}
.chip small{display:block;font-size:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
#top{display:flex;justify-content:space-between;align-items:baseline;padding:4px 12px}
#top h2{margin:0;font-size:20px}
#chart{height:360px;margin:0 4px}
#an{padding:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:600;font-size:14px}
.badge.up{background:#2bb39a26}.badge.dn{background:#ee5d5d26}.badge.n{background:#8a91a326;color:var(--mut)}
#an h3{font-size:16px;margin:16px 0 6px}
#an ul{margin:0;padding-left:18px}
#an li{margin:3px 0}
table{width:100%;border-collapse:collapse}
td{padding:6px 0;border-bottom:1px solid var(--bd)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.plan{background:var(--card);border-radius:12px;padding:12px;margin-top:6px}
.note{font-size:12px;color:var(--mut);margin-top:14px}
</style>
</head>
<body>
<header>
  <input id="sym" placeholder="Add NSE symbol, e.g. KROSS" autocapitalize="characters" autocomplete="off" aria-label="Add symbol">
  <button class="p" id="add">Add</button>
  <button id="cfg" aria-label="Settings">⚙</button>
</header>
<div id="chips"></div>
<div id="top"></div>
<div id="chart"></div>
<div id="an"></div>

<script>
const $ = id => document.getElementById(id);
addEventListener("error", e => { const a = $("an"); if (a) a.innerHTML = "<p class=\"dn\">Error: " + e.message + "</p>"; });
if (!window.LightweightCharts) { document.body.insertAdjacentHTML("beforeend", "<p class=\"dn\" style=\"padding:12px\">Chart library failed to load. Check your internet or ad blocker, then reload.</p>"); }
let WORKER = localStorage.getItem("worker") || "";
let list = JSON.parse(localStorage.getItem("wl") || '["RELIANCE.NS","KROSS.NS"]');
let cur = list[0] || null, lines = [], data = {}, lastFacts = null;
const f = v => v.toFixed(2);
const nm = s => s.replace(/\.NS$/, "");
const save = () => localStorage.setItem("wl", JSON.stringify(list));

// ---------- data ----------
async function load(sym) {
  const r = await fetch(WORKER + "?symbol=" + encodeURIComponent(sym));
  if (!r.ok) throw new Error("Could not load " + nm(sym) + " (check the symbol)");
  const j = await r.json();
  const res = j.chart && j.chart.result && j.chart.result[0];
  if (!res) throw new Error("No data for " + nm(sym));
  const q = res.indicators.quote[0], out = [];
  res.timestamp.forEach((t, i) => {
    if (q.close[i] == null || q.open[i] == null) return;
    out.push({ time: new Date((t + 19800) * 1000).toISOString().slice(0, 10),
      open: q.open[i], high: q.high[i], low: q.low[i], close: q.close[i], volume: q.volume[i] || 0 });
  });
  data[sym] = out;
  return out;
}

// ---------- indicators ----------
function ema(a, n) {
  const k = 2 / (n + 1), out = [];
  let p = a.slice(0, n).reduce((x, y) => x + y, 0) / n;
  for (let i = 0; i < a.length; i++) {
    if (i < n - 1) { out.push(null); continue; }
    if (i === n - 1) { out.push(p); continue; }
    p = a[i] * k + p * (1 - k); out.push(p);
  }
  return out;
}
function atr(d, n = 14) {
  const tr = d.slice(-n).map((x, i, a) => {
    const pc = (d[d.length - n + i - 1] || x).close;
    return Math.max(x.high - x.low, Math.abs(x.high - pc), Math.abs(x.low - pc));
  });
  return tr.reduce((x, y) => x + y, 0) / n;
}

// ---------- analysis ----------
function analyse(d) {
  if (d.length < 60) return "<p class='mut'>Not enough history for analysis.</p>";
  const n = d.length, c = d.map(x => x.close), L = d[n - 1];
  const e20a = ema(c, 20), e50a = ema(c, 50), e20 = e20a[n - 1], e50 = e50a[n - 1];
  const slope = (e20 / e20a[n - 6] - 1) * 100;
  const ext = (L.close / e20 - 1) * 100;
  const res = Math.max(...d.slice(-21, -1).map(x => x.high));
  const swingLow = Math.min(...d.slice(-11, -1).map(x => x.low));
  const A = atr(d);
  const vAvg = d.slice(-21, -1).reduce((s, x) => s + x.volume, 0) / 20;
  const vr = vAvg ? L.volume / vAvg : 0;
  const rng = L.high - L.low || 1;
  const wick = (L.high - Math.max(L.open, L.close)) / rng;
  const broke = L.close > res;
  const up = L.close > e20 && e20 > e50 && slope > 0;
  const down = L.close < e20 && e20 < e50;
  const trend = up ? ["Bullish", "up"] : down ? ["Bearish", "dn"] : ["Sideways", "n"];

  const pts = [];
  pts.push(up ? "Price is above the 20 and 50 EMA, and the 20 EMA is rising."
    : down ? "Price is below the 20 and 50 EMA. Trend is down."
    : "EMAs are mixed. No clear trend.");
  pts.push(Math.abs(ext) > 8 ? `Price is ${f(Math.abs(ext))}% ${ext > 0 ? "above" : "below"} the 20 EMA. That is stretched.`
    : `Price is ${f(ext)}% from the 20 EMA. Not stretched.`);
  pts.push(broke ? `Close is above the 20-day high of ₹${f(res)}. Breakout.`
    : `Price is ${f((res / L.close - 1) * 100)}% below the 20-day high of ₹${f(res)}.`);
  pts.push(vr > 1.5 ? `Volume is ${f(vr)}x its 20-day average. Strong participation.`
    : vr < 0.7 ? `Volume is ${f(vr)}x its 20-day average. Weak participation.`
    : `Volume is ${f(vr)}x its 20-day average. Normal.`);
  if (wick > 0.4) pts.push(`Long upper wick (${Math.round(wick * 100)}% of the candle). Sellers rejected higher prices.`);

  let plan, rows;
  if (up) {
    const stretched = ext > 8 || wick > 0.4;
    if (stretched) {
      const pb = broke ? res : e20, entry = pb * 1.01, stop = pb - A, r = entry - stop;
      plan = `<b>Wait for a pullback.</b> Look for a hold near ₹${f(pb)}–${f(pb * 1.02)} with a bullish candle.`;
      rows = [["Entry zone", `₹${f(pb)} – ${f(pb * 1.02)}`], ["Stop loss", "₹" + f(stop)], ["Target 1 (1:2)", "₹" + f(entry + 2 * r)], ["Target 2 (1:3)", "₹" + f(entry + 3 * r)]];
    } else {
      const stop = Math.max(L.close - 1.5 * A, Math.min(swingLow, e20)), r = L.close - stop;
      plan = broke ? "<b>Trend entry is reasonable here.</b> Risk is defined by the stop." : `<b>Buy on a close above ₹${f(res)}</b> with volume, or on a dip toward the 20 EMA.`;
      rows = [["Entry", "₹" + f(L.close)], ["Stop loss", "₹" + f(stop)], ["Target 1 (1:2)", "₹" + f(L.close + 2 * r)], ["Target 2 (1:3)", "₹" + f(L.close + 3 * r)]];
    }
  } else if (down) {
    plan = `<b>Avoid long trades.</b> Reconsider after a close above the 20 EMA (₹${f(e20)}).`;
    rows = [["20 EMA", "₹" + f(e20)], ["50 EMA", "₹" + f(e50)]];
  } else {
    plan = `<b>Wait.</b> A close above ₹${f(res)} with volume would start an uptrend.`;
    rows = [["20-day high", "₹" + f(res)], ["Swing low", "₹" + f(swingLow)]];
  }
  const lv = [["Resistance (20-day high)", "₹" + f(res)], ["Support: 20 EMA", "₹" + f(e20)], ["Support: 50 EMA", "₹" + f(e50)], ["ATR (14)", "₹" + f(A)]];
  lastFacts = { trend: trend[0], close: L.close, ema20: e20, ema50: e50, pctAboveEma20: ext, high20d: res, swingLow10d: swingLow,
    atr14: A, volumeVsAvg20: vr, upperWickPct: wick * 100, brokeOut: broke, rulePlan: plan.replace(/<[^>]+>/g, ""),
    last10: d.slice(-10).map(x => [x.time, x.open, x.high, x.low, x.close, x.volume]) };
  const tr = r => r.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("");
  return `<span class="badge ${trend[1]}">${trend[0]}</span>
    <h3>What the chart shows</h3><ul>${pts.map(p => "<li>" + p + "</li>").join("")}</ul>
    <h3>Plan</h3><div class="plan">${plan}<table>${tr(rows)}</table></div>
    <h3>Key levels</h3><table>${tr(lv)}</table>
    <p class="note">Rule-based analysis plus Gemini commentary, from delayed Yahoo daily data. Not financial advice. Risk 1–2% of capital per trade.</p>`;
}

// ---------- chart ----------
const chart = LightweightCharts.createChart($("chart"), {
  layout: { background: { color: "#14161c" }, textColor: "#8a91a3" },
  grid: { vertLines: { color: "#1d2029" }, horzLines: { color: "#1d2029" } },
  rightPriceScale: { borderColor: "#2b2f3b" }, timeScale: { borderColor: "#2b2f3b" },
  width: $("chart").clientWidth, height: 360,
});
const cs = chart.addCandlestickSeries({ upColor: "#2bb39a", downColor: "#ee5d5d", borderVisible: false, wickUpColor: "#2bb39a", wickDownColor: "#ee5d5d" });
cs.priceScale().applyOptions({ scaleMargins: { top: 0.05, bottom: 0.25 } });
const s20 = chart.addLineSeries({ color: "#ff9800", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const s50 = chart.addLineSeries({ color: "#4caf50", lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const vs = chart.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "" });
vs.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
addEventListener("resize", () => chart.applyOptions({ width: $("chart").clientWidth }));

function draw(sym) {
  const d = data[sym], c = d.map(x => x.close), a = ema(c, 20), b = ema(c, 50);
  cs.setData(d);
  s20.setData(d.map((x, i) => a[i] == null ? { time: x.time } : { time: x.time, value: a[i] }));
  s50.setData(d.map((x, i) => b[i] == null ? { time: x.time } : { time: x.time, value: b[i] }));
  vs.setData(d.map(x => ({ time: x.time, value: x.volume, color: x.close >= x.open ? "#2bb39a66" : "#ee5d5d66" })));
  lines.forEach(l => cs.removePriceLine(l)); lines = [];
  const res = Math.max(...d.slice(-21, -1).map(x => x.high));
  lines.push(cs.createPriceLine({ price: res, color: "#5b9bff", lineWidth: 1, title: "Res" }));
  chart.timeScale().setVisibleLogicalRange({ from: d.length - 110, to: d.length + 4 });
  const L = d[d.length - 1], P = d[d.length - 2], ch = (L.close / P.close - 1) * 100;
  $("top").innerHTML = `<h2>${nm(sym)} <span class="${ch >= 0 ? "up" : "dn"}">₹${f(L.close)} ${ch >= 0 ? "+" : ""}${f(ch)}%</span></h2><button id="rm">Remove</button>`;
  $("rm").onclick = () => { list = list.filter(x => x !== sym); save(); cur = list[0] || null; render(); };
  $("an").innerHTML = analyse(d) + aiBox(sym);
  if ($("aib")) $("aib").onclick = () => askAI(sym);
}

// ---------- gemini ----------
const aiKey = s => "ai:" + s + ":" + data[s][data[s].length - 1].time;
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
function aiBox(sym) {
  const t = localStorage.getItem(aiKey(sym));
  return `<h3>AI commentary</h3><div id="ai" class="plan">${t ? esc(t) : '<button class="p" id="aib">Get AI commentary</button>'}</div>`;
}
async function askAI(sym) {
  const box = $("ai");
  box.innerHTML = "<span class='mut'>Thinking…</span>";
  try {
    const r = await fetch(WORKER.replace(/\/+$/, "") + "/ai", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol: nm(sym), facts: lastFacts }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "AI request failed");
    localStorage.setItem(aiKey(sym), j.text);
    box.innerHTML = esc(j.text);
  } catch (e) {
    box.innerHTML = `<span class="dn">${e.message}</span><br><button id="aib">Retry</button>`;
    $("aib").onclick = () => askAI(sym);
  }
}

// ---------- ui ----------
function chips() {
  $("chips").innerHTML = list.map(s => {
    const d = data[s], L = d && d[d.length - 1], P = d && d[d.length - 2];
    const ch = L && P ? (L.close / P.close - 1) * 100 : null;
    return `<button class="chip ${s === cur ? "on" : ""}" data-s="${s}">${nm(s)}<small class="${ch >= 0 ? "up" : "dn"}">${ch == null ? "…" : f(L.close) + "  " + (ch >= 0 ? "+" : "") + f(ch) + "%"}</small></button>`;
  }).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = b.dataset.s; render(); });
}
async function render() {
  chips();
  if (!WORKER) { $("an").innerHTML = "<p>Set your Worker URL first. Tap ⚙ and paste the URL of your Cloudflare Worker.</p>"; return; }
  if (!cur) { $("top").innerHTML = ""; $("an").innerHTML = "<p class='mut'>Your watchlist is empty. Add an NSE symbol above.</p>"; return; }
  try {
    if (!data[cur]) { $("an").innerHTML = "<p class='mut'>Loading…</p>"; await load(cur); }
    draw(cur); chips();
  } catch (e) { $("an").innerHTML = `<p class="dn">${e.message}</p>`; }
}
$("add").onclick = () => {
  let s = $("sym").value.trim().toUpperCase().replace(/\s+/g, "");
  if (!s) return;
  if (!/[.^]/.test(s)) s += ".NS";
  if (!list.includes(s)) { list.push(s); save(); }
  cur = s; $("sym").value = ""; render();
};
$("sym").onkeydown = e => { if (e.key === "Enter") $("add").click(); };
$("cfg").onclick = () => {
  const v = prompt("Cloudflare Worker URL", WORKER);
  if (v != null) { WORKER = v.trim(); localStorage.setItem("worker", WORKER); data = {}; render(); loadAll(); }
};
async function loadAll() {
  if (!WORKER) return;
  for (const s of list) { try { await load(s); chips(); } catch (e) {} }
}
// refresh the open stock every 60 seconds while the tab is visible
setInterval(async () => {
  if (!WORKER || !cur || document.hidden) return;
  try { await load(cur); draw(cur); chips(); } catch (e) {}
}, 60000);

render().then(loadAll);
</script>
</body>
</html>
